# No development database fallback or automatic local .env import in production.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Platform log collection will consume stdout; never install a file appender.
logging.config=classpath:logback-console.xml
management.endpoint.health.show-details=never
server.error.include-stacktrace=never

# Defense in depth: nginx only proxies /api/, but never serve API docs in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
