name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing image tag (commit SHA) to deploy, for rollback. Empty builds HEAD."
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ inputs.tag == '' || inputs.tag == null }}
    uses: ./.github/workflows/ci.yml

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: backend, target: api }
          - { name: data-job, context: backend, target: data-job }
          - { name: frontend, context: frontend, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/whos-hot-nhl-${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.owner }}/whos-hot-nhl-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    # Run on rollback (images skipped) as well as normal pushes.
    needs: images
    if: ${{ always() && (needs.images.result == 'success' || (inputs.tag != '' && inputs.tag != null)) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Sync compose files
        run: |
          scp -i ~/.ssh/id_deploy compose.yaml "deploy@${{ secrets.DEPLOY_HOST }}:/opt/whos-hot/compose.yaml"
          scp -i ~/.ssh/id_deploy deploy/Caddyfile "deploy@${{ secrets.DEPLOY_HOST }}:/opt/whos-hot/deploy/Caddyfile"
      - name: Deploy
        env:
          TAG: ${{ inputs.tag || github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          ssh -i ~/.ssh/id_deploy "deploy@${{ secrets.DEPLOY_HOST }}" \
            bash -s -- "$TAG" "$GHCR_USER" "$GHCR_TOKEN" <<'REMOTE'
          set -euo pipefail
          tag="$1"; user="$2"; token="$3"
          cd /opt/whos-hot
          grep -q '^DB_PASSWORD=.\+' .env || { echo "DB_PASSWORD missing in server .env" >&2; exit 1; }
          grep -q '^APP_PROFILE=prod' .env || { echo "APP_PROFILE=prod missing in server .env" >&2; exit 1; }
          previous=$(grep '^IMAGE_TAG=' .env | cut -d= -f2- || true)
          sed -i '/^IMAGE_TAG=/d' .env
          echo "IMAGE_TAG=$tag" >> .env
          if [ -n "$token" ]; then
            echo "$token" | docker login ghcr.io -u "$user" --password-stdin
          fi
          docker compose --profile prod pull
          # postgres + api first (Flyway), data-job waits on api health. Single data-job instance.
          docker compose --profile prod up -d --remove-orphans
          # Smoke test through the public proxy path (Caddy -> nginx -> api).
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/ \
               && curl -fsS -o /dev/null http://localhost:3000/api/search/all; then
              echo "Deployed $tag (previous: ${previous:-none})"
              docker image prune -f >/dev/null
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed for $tag; previous tag was ${previous:-none}. Re-run with tag input to roll back." >&2
          docker compose --profile prod ps >&2
          exit 1
          REMOTE
