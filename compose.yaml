name: whos-hot-nhl

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: nhl_stats
      POSTGRES_USER: whoshot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-whoshot_local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whoshot -d nhl_stats"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend-api:
    build:
      context: ./backend
      target: api
    image: ghcr.io/${GHCR_OWNER:-kyozoku-des}/whos-hot-nhl-api:${IMAGE_TAG:-local}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nhl_stats
      SPRING_DATASOURCE_USERNAME: whoshot
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-whoshot_local}
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-local}
      LOG_DIRECTORY: /app/logs
    volumes:
      - ./backend/logs:/app/logs
    # The Alpine JRE image has no curl; busybox wget is available.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  data-job:
    build:
      context: ./backend
      target: data-job
    image: ghcr.io/${GHCR_OWNER:-kyozoku-des}/whos-hot-nhl-data-job:${IMAGE_TAG:-local}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nhl_stats
      SPRING_DATASOURCE_USERNAME: whoshot
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-whoshot_local}
      SPRING_PROFILES_ACTIVE: ${DATA_JOB_PROFILE:-${APP_PROFILE:-local}}
      LOG_DIRECTORY: /app/logs
    volumes:
      - ./backend/logs:/app/logs
    # Both apps run Flyway; start the API first so migrations never race.
    depends_on:
      postgres:
        condition: service_healthy
      backend-api:
        condition: service_healthy
    restart: unless-stopped

  # One-off historical season load. Not started by `up`; run explicitly:
  #   podman-compose run --rm -e BACKFILL_SEASON=20242025 backfill
  backfill:
    build:
      context: ./backend
      target: data-job
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles:
      - backfill
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nhl_stats
      SPRING_DATASOURCE_USERNAME: whoshot
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-whoshot_local}
      SPRING_PROFILES_ACTIVE: local,backfill
      LOGGING_FILE_NAME: /app/logs/backfill.log
      BACKFILL_SEASON: ${BACKFILL_SEASON:-}
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/${GHCR_OWNER:-kyozoku-des}/whos-hot-nhl-frontend:${IMAGE_TAG:-local}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    # No VITE_API_BASE_URL here: Vite inlines import.meta.env at build time, so a
    # runtime env var has no effect on the already-built bundle. The app uses a
    # relative /api base and nginx proxies it to backend-api.
    depends_on:
      - backend-api
    restart: unless-stopped

  # TLS termination and public entrypoint. Prod only: `docker compose --profile prod up -d`.
  caddy:
    image: caddy:2
    profiles:
      - prod
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
